services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: ven-api:local
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: db
      DB_PORT: 3306
      VEN_DB_CLIENT_HOST: "%"
      VEN_RUN_MIGRATIONS: "true"
    volumes:
      - ven_storage:/var/www/html/storage
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "php artisan about --only=environment >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: ven-web:local
    restart: unless-stopped
    ports:
      - "${VEN_HTTP_PORT:-8080}:80"
    volumes:
      - ven_storage:/var/www/html/storage:ro
    networks:
      - frontend
      - backend
    depends_on:
      - app
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 128M

  db:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      MYSQL_DATABASE: ven
      MYSQL_ROOT_HOST: "%"
    command:
      - --innodb-buffer-pool-size=256M
      - --max-connections=50
      - --performance-schema=OFF
    volumes:
      - ven_mysql:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.90"
          memory: 896M

  loadtest:
    image: grafana/k6:0.52.0
    profiles:
      - loadtest
    volumes:
      - ./docker/loadtest:/scripts:ro
    networks:
      - frontend
    command: ["run", "/scripts/smoke.js"]
    environment:
      BASE_URL: http://web
      LOAD_TOKEN: ${LOAD_TOKEN:-}
      VUS: ${VUS:-10}
      DURATION: ${DURATION:-2m}

networks:
  frontend:
  backend:
    internal: true

volumes:
  ven_mysql:
  ven_storage:
